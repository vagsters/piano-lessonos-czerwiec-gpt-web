<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano Tutor</title>
  <link rel="stylesheet" href="https://unpkg.com/react-piano/dist/styles.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://unpkg.com/tone/build/Tone.js"></script>
  <script src="https://unpkg.com/react-piano/dist/react-piano.js"></script>
  <script src="https://unpkg.com/pitchy@4/dist/pitchy.min.js"></script>
</head>
<body>
  <h1>Piano Tutor</h1>
  <button id="mic-btn">Uruchom mikrofon</button>
  <button id="metro-btn">Metronom start/stop</button>
  <label>
    Tempo: <input type="range" id="bpm-slider" min="40" max="180" value="60" />
    <span id="bpm-val">60</span> BPM
  </label>
  <div id="pitch-info"></div>
  <div id="root"></div>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
